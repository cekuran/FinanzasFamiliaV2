<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>Finanzas Familia</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Cpath d='M20 22h28v18a4 4 0 0 1-4 4H24a4 4 0 0 1-4-4V22zm4 4v14h20V26H24zm2 3h6v8h-6v-8z' fill='white'/%3E%3C/svg%3E" />
  <style>
    :root {
      --primary: #0f766e;
      --primary-700: #115e59;
      --bg: #f8fafc;
      --fg: #0f172a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--fg);
      background: var(--bg);
      display: grid;
      grid-template-rows: auto 1fr;
    }
    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--primary);
      color: white;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }
    header .logo {
      width: 32px; height: 32px;
      display: grid; place-items: center;
      background: rgba(255,255,255,.15);
      border-radius: 8px;
      font-size: 18px;
    }
    header h1 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
      letter-spacing: .2px;
    }
    header .spacer { flex: 1; }
    header a {
      color: white;
      text-decoration: none;
      font-size: 13px;
      opacity: .85;
      padding: 6px 10px;
      border-radius: 6px;
    }
    header a:hover { background: rgba(255,255,255,.12); opacity: 1; }
    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: white;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 64 64" fill="none">
        <rect x="14" y="20" width="36" height="28" rx="4" stroke="white" stroke-width="3" fill="none"/>
        <path d="M22 30h20M22 38h12" stroke="white" stroke-width="3" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>Finanzas Familia</h1>
    <div class="spacer"></div>
    <a href="https://script.google.com/macros/s/1B7IYG8TLx6T5VBb3eIbvq5Mlpzr205Kne2P2iQF7G7KMqUY1PWhudBnE/exec" target="_top" rel="noopener">Abrir en pestaña</a>
  </header>
  <iframe
    src="https://script.google.com/macros/s/1B7IYG8TLx6T5VBb3eIbvq5Mlpzr205Kne2P2iQF7G7KMqUY1PWhudBnE/exec"
    title="Finanzas Familia"
    allow="fullscreen"
    referrerpolicy="no-referrer"
    sandbox="allow-scripts allow-forms allow-popups allow-same-origin allow-downloads"></iframe>
</body>
</html>
